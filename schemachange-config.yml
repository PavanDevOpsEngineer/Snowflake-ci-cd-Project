config-version: 2

root-folder: 'migrations'
modules-folder: null

snowflake-account:   '{{ env_var("SF_ACCOUNT") }}'
snowflake-user:      '{{ env_var("SF_USER") }}'
snowflake-role:      '{{ env_var("SF_ROLE") }}'
snowflake-warehouse: '{{ env_var("SF_WAREHOUSE") }}'
snowflake-database:  '{{ env_var("SF_DATABASE") }}'
snowflake-schema:    'SCHEMACHANGE'

change-history-table: 'SCHEMACHANGE.CHANGE_HISTORY'
create-change-history-table: true
autocommit: false
dry-run: false
query-tag: 'schemachange-cicd'

vars:
  env_schema: '{{ env_var("SF_SCHEMA", "APP") }}'
