name: CD - Deploy to DEV

on:
  push:
    branches: [develop]
    paths:
      - 'migrations/**'
      - 'schemachange-config.yml'

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy-dev:
    name: Deploy to DEV environment
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install schemachange
        run: pip install schemachange==3.7.0

      - name: Install pre-commit and SQLFluff
        run: |
          pip install pre-commit sqlfluff
          pre-commit install

      - name: Lint SQL with sqlfluff (pre-commit)
        run: pre-commit run sqlfluff-lint --all-files || true

      - name: Deploy migrations
        env:
          SF_ACCOUNT:   ${{ secrets.SF_ACCOUNT }}
          SF_USER:      ${{ secrets.SF_USER }}
          SF_ROLE:      ${{ secrets.SF_ROLE }}
          SF_WAREHOUSE: ${{ secrets.SF_WAREHOUSE }}
          SF_DATABASE:  ${{ secrets.SF_DB_DEV }}
          SF_SCHEMA:    'APP'
          SNOWFLAKE_PASSWORD: ${{ secrets.SF_PASSWORD }}
        run: schemachange deploy --config-folder . --verbose

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Run post-deploy validation tests
        env:
          SF_ACCOUNT:  ${{ secrets.SF_ACCOUNT }}
          SF_USER:     ${{ secrets.SF_USER }}
          SF_PASSWORD: ${{ secrets.SF_PASSWORD }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SF_PASSWORD }}
          SF_ROLE:     ${{ secrets.SF_ROLE }}
          SF_WAREHOUSE: ${{ secrets.SF_WAREHOUSE }}
          SF_DATABASE: ${{ secrets.SF_DB_DEV }}
          SF_SCHEMA:   'APP'
        run: pytest tests/ -v --tb=short
