name: CD - Deploy to PROD (manual approval)

on:
  push:
    branches: [main]
    paths:
      - 'migrations/**'
      - 'schemachange-config.yml'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'deploy'
        type: choice
        options: [deploy, rollback]
      target_version:
        description: 'Version to rollback to (only for rollback)'
        required: false
        default: ''

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy-prod:
    name: Deploy / Rollback PROD
    runs-on: ubuntu-latest
    environment:
      name: prod

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install schemachange
        run: pip install schemachange==3.7.0

      - name: Pre-deploy DDL backup
        env:
          SF_ACCOUNT:  ${{ secrets.SF_ACCOUNT }}
          SF_USER:     ${{ secrets.SF_USER }}
          SF_PASSWORD: ${{ secrets.SF_PASSWORD }}
          SF_ROLE:     ${{ secrets.SF_ROLE }}
          SF_WAREHOUSE: ${{ secrets.SF_WAREHOUSE }}
          SF_DATABASE: ${{ secrets.SF_DB_PROD }}
        run: python scripts/backup_ddl.py

      - name: Dry-run migrations
        if: ${{ github.event.inputs.action != 'rollback' }}
        env:
          SF_ACCOUNT:        ${{ secrets.SF_ACCOUNT }}
          SF_USER:           ${{ secrets.SF_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SF_PASSWORD }}
          SF_ROLE:           ${{ secrets.SF_ROLE }}
          SF_WAREHOUSE:      ${{ secrets.SF_WAREHOUSE }}
          SF_DATABASE:       ${{ secrets.SF_DB_PROD }}
          SF_SCHEMA:         'APP'
        run: schemachange deploy --config-folder . --dry-run --verbose

      - name: Deploy to PROD
        if: ${{ github.event.inputs.action != 'rollback' }}
        env:
          SF_ACCOUNT:        ${{ secrets.SF_ACCOUNT }}
          SF_USER:           ${{ secrets.SF_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SF_PASSWORD }}
          SF_ROLE:           ${{ secrets.SF_ROLE }}
          SF_WAREHOUSE:      ${{ secrets.SF_WAREHOUSE }}
          SF_DATABASE:       ${{ secrets.SF_DB_PROD }}
          SF_SCHEMA:         'APP'
        run: schemachange deploy --config-folder . --verbose

      - name: Rollback PROD
        if: ${{ github.event.inputs.action == 'rollback' }}
        env:
          SF_ACCOUNT:  ${{ secrets.SF_ACCOUNT }}
          SF_USER:     ${{ secrets.SF_USER }}
          SF_PASSWORD: ${{ secrets.SF_PASSWORD }}
          SF_ROLE:     ${{ secrets.SF_ROLE }}
          SF_WAREHOUSE: ${{ secrets.SF_WAREHOUSE }}
          SF_DATABASE: ${{ secrets.SF_DB_PROD }}
          SF_SCHEMA:   'APP'
          TARGET_VERSION: ${{ github.event.inputs.target_version }}
        run: python scripts/rollback.py

      - name: Smoke tests
        env:
          SF_ACCOUNT:  ${{ secrets.SF_ACCOUNT }}
          SF_USER:     ${{ secrets.SF_USER }}
          SF_PASSWORD: ${{ secrets.SF_PASSWORD }}
          SF_ROLE:     ${{ secrets.SF_ROLE }}
          SF_WAREHOUSE: ${{ secrets.SF_WAREHOUSE }}
          SF_DATABASE: ${{ secrets.SF_DB_PROD }}
          SF_SCHEMA:   'APP'
        run: |
          pip install -r tests/requirements.txt
          pytest tests/ -v -m "smoke" --tb=short

      - name: Notify Slack on failure
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{"text":":rotating_light: PROD deploy FAILED\nActor: ${{ github.actor }}\nRef: ${{ github.ref }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' \
            ${{ secrets.SLACK_WEBHOOK_URL }}
