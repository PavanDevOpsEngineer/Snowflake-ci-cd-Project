name: CD - Deploy to PROD (manual approval)

on:
  push:
    branches: [main]
    paths:
      - 'migrations/**'
      - 'schemachange-config.yml'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'deploy'
        type: choice
        options: [deploy, rollback]
      target_version:
        description: 'Version to rollback to (only for rollback)'
        required: false
        default: ''

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/deploy-common.yml
    with:
      environment_name: prod
      sf_schema: 'APP'
      action: ${{ github.event.inputs.action }}
      target_version: ${{ github.event.inputs.target_version }}
      run_backup: true
    secrets:
      SF_ACCOUNT: ${{ secrets.SF_ACCOUNT }}
      SF_USER: ${{ secrets.SF_USER }}
      SF_PASSWORD: ${{ secrets.SF_PASSWORD }}
      SF_ROLE: ${{ secrets.SF_ROLE }}
      SF_WAREHOUSE: ${{ secrets.SF_WAREHOUSE }}
      SF_DATABASE: ${{ secrets.SF_DB_PROD }}
    

  smoke-tests:
    name: Smoke tests
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4
      - name: Smoke tests
        env:
          SF_ACCOUNT:  ${{ secrets.SF_ACCOUNT }}
          SF_USER:     ${{ secrets.SF_USER }}
          SF_PASSWORD: ${{ secrets.SF_PASSWORD }}
          SF_ROLE:     ${{ secrets.SF_ROLE }}
          SF_WAREHOUSE: ${{ secrets.SF_WAREHOUSE }}
          SF_DATABASE: ${{ secrets.SF_DB_PROD }}
          SF_SCHEMA:   'APP'
        run: |
          pip install -r tests/requirements.txt
          pytest tests/ -v -m "smoke" --tb=short

  notify-on-failure:
    name: Notify Slack on failure
    runs-on: ubuntu-latest
    needs: deploy
    if: ${{ needs.deploy.result != 'success' }}
    steps:
      - name: Notify Slack
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{"text":":rotating_light: PROD deploy FAILED\nActor: ${{ github.actor }}\nRef: ${{ github.ref }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' \
            ${{ secrets.SLACK_WEBHOOK_URL }}
